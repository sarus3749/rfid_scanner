<text x="60" y="1062" font-size="13" fill="#333">D3 (GPIO0) et D8 (GPIO15) sont des broches de démarrage : si le D1 Mini refuse de démarrer, vérifier RST et SDA.</text>
<text x="60" y="1082" font-size="13" fill="#333">D4 pilote la LED intégrée, allumée quand le WiFi est connecté : rien à câbler. IRQ du RC522 reste libre.</text>
<text x="60" y="1118" font-size="13" font-weight="bold" fill="#b71c1c">⚠ Jamais de 5 V sur le RC522. Le buzzer doit être actif : le firmware ne génère pas de fréquence.</text>
