; Configuration PlatformIO
; https://docs.platformio.org/page/projectconf.html
;
; Deux environnements :
;   - d1_mini_usb : premier flash, au câble USB
;   - d1_mini_ota : mises à jour suivantes, par le WiFi (ArduinoOTA)

[env]
platform = espressif8266
board = d1_mini
platform_packages =
	platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Seule bibliothèque externe : les autres (WiFi, OTA, serveur web, mDNS,
; HTTPClient, EEPROM, DNSServer) sont fournies par le cœur ESP8266.
lib_deps =
	miguelbalboa/MFRC522@^1.4.11

[env:d1_mini_usb]
upload_protocol = esptool

[env:d1_mini_ota]
; Doit correspondre à HOSTNAME et OTA_PASSWORD dans include/config.h
upload_protocol = espota
upload_port = RFID-SCANNER.local
upload_flags =
	--auth=password123
	--port=8266
